<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voting Poll</title>
</head>
<body>
    <h1>Voting Poll</h1>

    <div>
        <h2>What is your favorite programming language?</h2>
        <button id="option1">JavaScript</button>
        <button id="option2">Python</button>
        <button id="option3">Java</button>
    </div>

    <hr />

    <div>
        <h2>Results</h2>
        <div>
            <p>JavaScript: <span id="percent1">0</span>% (<span id="votes1">0</span> votes)</p>
            <div style="background-color: #f0f0f0; width: 300px; height: 20px;">
                <div id="bar1" style="background-color: #4CAF50; height: 100%; width: 0%;"></div>
            </div>
        </div>

        <div>
            <p>Python: <span id="percent2">0</span>% (<span id="votes2">0</span> votes)</p>
            <div style="background-color: #f0f0f0; width: 300px; height: 20px;">
                <div id="bar2" style="background-color: #2196F3; height: 100%; width: 0%;"></div>
            </div>
        </div>

        <div>
            <p>Java: <span id="percent3">0</span>% (<span id="votes3">0</span> votes)</p>
            <div style="background-color: #f0f0f0; width: 300px; height: 20px;">
                <div id="bar3" style="background-color: #FF9800; height: 100%; width: 0%;"></div>
            </div>
        </div>

        <p>Total Votes: <span id="totalVotes">0</span></p>
    </div>
<script>
const option1Btn=document.getElementById('option1'),option2Btn=document.getElementById('option2'),option3Btn=document.getElementById('option3');let votes={javascript:0,python:0,java:0};function updateResults(){const e=votes.javascript+votes.python+votes.java,t=0===e?0:Math.round(100*votes.javascript/e),n=0===e?0:Math.round(100*votes.python/e),o=0===e?0:Math.round(100*votes.java/e);document.getElementById('votes1').textContent=votes.javascript,document.getElementById('votes2').textContent=votes.python,document.getElementById('votes3').textContent=votes.java,document.getElementById('percent1').textContent=t,document.getElementById('percent2').textContent=n,document.getElementById('percent3').textContent=o,document.getElementById('bar1').style.width=t+'%',document.getElementById('bar2').style.width=n+'%',document.getElementById('bar3').style.width=o+'%',document.getElementById('totalVotes').textContent=e}option1Btn.addEventListener('click',()=>{votes.javascript++,updateResults()}),option2Btn.addEventListener('click',()=>{votes.python++,updateResults()}),option3Btn.addEventListener('click',()=>{votes.java++,updateResults()});
</script>
</body>
</html>
