<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Word Counter</title>
</head>
<body>
    <h1>Live Word Counter</h1>

    <textarea id="textArea" placeholder="Start typing..." style="width:100%; height:200px;"></textarea>

    <p>Word Count: <span id="wordCount">0</span></p>

    <div id="warning" style="display:none; color:red;">
        ⚠️ Warning: You have exceeded 100 words!
    </div>
<script>
const textArea=document.getElementById('textArea'),wordCount=document.getElementById('wordCount'),warning=document.getElementById('warning');textArea.addEventListener('input',()=>{let e=0;const t=textArea.value.trim();t.length>0&&(e=t.split(/\s+/).length),wordCount.textContent=e,e>100?warning.style.display='block':warning.style.display='none'});
</script>
</body>
</html>
