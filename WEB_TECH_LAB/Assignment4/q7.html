<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Preferences</title>
</head>
<body>
    <h1>Save Favorite Color</h1>

    <input type="color" id="colorInput" />
    <button id="saveBtn">Save</button>
    <button id="clearBtn">Clear</button>

    <p id="message"></p>
<script>
const colorInput=document.getElementById('colorInput'),saveBtn=document.getElementById('saveBtn'),clearBtn=document.getElementById('clearBtn'),message=document.getElementById('message'),savedColor=localStorage.getItem('favoriteColor');savedColor&&(colorInput.value=savedColor,document.body.style.backgroundColor=savedColor,message.textContent='Color loaded from storage'),saveBtn.addEventListener('click',()=>{const e=colorInput.value;localStorage.setItem('favoriteColor',e),document.body.style.backgroundColor=e,message.textContent='Color saved!'}),clearBtn.addEventListener('click',()=>{localStorage.removeItem('favoriteColor'),document.body.style.backgroundColor='white',colorInput.value='#ffffff',message.textContent='Color cleared!'});
</script>
</body>
</html>
