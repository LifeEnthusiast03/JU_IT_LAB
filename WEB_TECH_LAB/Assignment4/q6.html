<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form Validator</title>
</head>
<body>
    <h1>Login Form Validator</h1>

    <form id="loginForm">
        <div>
            <label for="username">Username:</label>
            <input type="text" id="username" placeholder="Enter username (min 5 chars)" />
            <span id="usernameError" style="color:red;"></span>
        </div>

        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Enter valid email" />
            <span id="emailError" style="color:red;"></span>
        </div>

        <div>
            <label for="password">Password:</label>
            <input type="password" id="password" placeholder="Enter password (min 8 chars)" />
            <span id="passwordError" style="color:red;"></span>
        </div>

        <button type="submit">Login</button>
    </form>

    <div id="successMessage" style="display:none;color:green;">
        <p>Login successful!</p>
    </div>

    <script src="q6.js"></script>
</body>
</html>
