<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form Validator</title>
</head>
<body>
    <h1>Login Form Validator</h1>

    <form id="loginForm">
        <div>
            <label for="username">Username:</label>
            <input type="text" id="username" placeholder="Enter username (min 5 chars)" />
            <span id="usernameError" style="color:red;"></span>
        </div>

        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Enter valid email" />
            <span id="emailError" style="color:red;"></span>
        </div>

        <div>
            <label for="password">Password:</label>
            <input type="password" id="password" placeholder="Enter password (min 8 chars)" />
            <span id="passwordError" style="color:red;"></span>
        </div>

        <button type="submit">Login</button>
    </form>

    <div id="successMessage" style="display:none;color:green;">
        <p>Login successful!</p>
    </div>
<script>
const loginForm=document.getElementById('loginForm'),usernameInput=document.getElementById('username'),emailInput=document.getElementById('email'),passwordInput=document.getElementById('password'),usernameError=document.getElementById('usernameError'),emailError=document.getElementById('emailError'),passwordError=document.getElementById('passwordError'),successMessage=document.getElementById('successMessage');function validateUsername(e){return/^.{5,}$/.test(e)}function validateEmail(e){return/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)}function validatePassword(e){return/^.{8,}$/.test(e)}loginForm.addEventListener('submit',(e)=>{e.preventDefault(),usernameError.textContent='',emailError.textContent='',passwordError.textContent='',successMessage.style.display='none';let t=!0;validateUsername(usernameInput.value)||(usernameError.textContent='Username must be at least 5 characters',t=!1),validateEmail(emailInput.value)||(emailError.textContent='Please enter a valid email',t=!1),validatePassword(passwordInput.value)||(passwordError.textContent='Password must be at least 8 characters',t=!1),t&&(successMessage.style.display='block',loginForm.reset())});
</script>
</body>
</html>
