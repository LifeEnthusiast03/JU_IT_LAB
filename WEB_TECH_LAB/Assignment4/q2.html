<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIN Verification System</title>
</head>
<body>
    <h1>PIN Verification System</h1>

    <div>
        <button id="generateBtn">Generate PIN</button>
    </div>

    <div id="gameContainer" style="display:none;">
        <p>PIN has been generated. Try to guess it!</p>
        <p>Attempts Remaining: <span id="attempts">3</span></p>
        <p id="message"></p>

        <div>
            <input type="text" id="pinInput" placeholder="Enter 4-digit PIN" maxlength="4" />
            <button id="verifyBtn">Verify PIN</button>
        </div>
    </div>

    <script src="q2.js"></script>
</body>
</html>
