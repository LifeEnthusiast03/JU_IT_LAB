<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Display</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .search-box {
            margin-bottom: 20px;
        }

        .search-box input {
            padding: 10px;
            width: 300px;
            font-size: 16px;
        }

        .products-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .product-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .product-card h3 {
            margin: 10px 0;
        }

        .product-card p {
            margin: 5px 0;
            color: #666;
        }

        .product-card .price {
            font-size: 20px;
            color: #27ae60;
            font-weight: bold;
        }

        .no-products {
            text-align: center;
            padding: 40px;
            color: #999;
        }
    </style>
</head>
<body>
    <h1>Product Catalog</h1>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search products..." />
    </div>

    <div id="productsContainer" class="products-container"></div>
<script>
const searchInput=document.getElementById('searchInput'),productsContainer=document.getElementById('productsContainer');let allProducts=[];fetch('products.json').then(e=>e.json()).then(e=>{allProducts=e,displayProducts(allProducts)}),searchInput.addEventListener('input',(e)=>{const t=e.target.value.toLowerCase(),d=allProducts.filter(e=>e.name.toLowerCase().includes(t));displayProducts(d)});function displayProducts(e){productsContainer.innerHTML='';let t=document.createElement('div');if(0===e.length)return t.className='no-products',t.textContent='No products found',productsContainer.appendChild(t),void 0;e.forEach(e=>{let d=document.createElement('div');d.className='product-card';let n=document.createElement('h3');n.textContent=e.name;let o=document.createElement('p');o.textContent='Category: '+e.category;let s=document.createElement('p');s.className='price',s.textContent='\$'+e.price.toFixed(2),d.appendChild(n),d.appendChild(o),d.appendChild(s),productsContainer.appendChild(d)})}
</script>
</body>
</html>
