<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Largest Number Finder</title>
</head>
<body>
    <h1>Find Largest Number</h1>

    <div>
        <label>Number 1:</label>
        <input type="number" id="num1" placeholder="Enter first number" />
    </div>

    <div>
        <label>Number 2:</label>
        <input type="number" id="num2" placeholder="Enter second number" />
    </div>

    <div>
        <label>Number 3:</label>
        <input type="number" id="num3" placeholder="Enter third number" />
    </div>

    <button id="findBtn">Find Largest</button>

    <p id="result"></p>

    <script>
        const num1 = document.getElementById('num1');
        const num2 = document.getElementById('num2');
        const num3 = document.getElementById('num3');
        const findBtn = document.getElementById('findBtn');
        const result = document.getElementById('result');

        findBtn.addEventListener('click', () => {
            const n1 = parseFloat(num1.value);
            const n2 = parseFloat(num2.value);
            const n3 = parseFloat(num3.value);

            if (isNaN(n1) || isNaN(n2) || isNaN(n3)) {
                result.textContent = 'Please enter all three numbers!';
                result.style.color = 'red';
                return;
            }

            let largest = n1;

            if (n2 > largest) {
                largest = n2;
            }

            if (n3 > largest) {
                largest = n3;
            }

            result.textContent = 'The largest number is: ' + largest;
            result.style.color = 'green';
        });
    </script>
</body>
</html>
