<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marks Calculator</title>
</head>
<body>
    <h1>Marks Calculator</h1>

    <div>
        <label>Subject 1 Marks:</label>
        <input type="number" id="subject1" placeholder="Enter marks" />
    </div>

    <div>
        <label>Subject 2 Marks:</label>
        <input type="number" id="subject2" placeholder="Enter marks" />
    </div>

    <div>
        <label>Subject 3 Marks:</label>
        <input type="number" id="subject3" placeholder="Enter marks" />
    </div>

    <button id="calculateBtn">Calculate</button>

    <div id="result" style="margin-top: 20px; padding: 15px; border: 1px solid #ccc;"></div>

    <script>
        const subject1 = document.getElementById('subject1');
        const subject2 = document.getElementById('subject2');
        const subject3 = document.getElementById('subject3');
        const calculateBtn = document.getElementById('calculateBtn');
        const result = document.getElementById('result');

        calculateBtn.addEventListener('click', () => {
            const s1 = parseFloat(subject1.value);
            const s2 = parseFloat(subject2.value);
            const s3 = parseFloat(subject3.value);

            if (isNaN(s1) || isNaN(s2) || isNaN(s3)) {
                result.innerHTML = '<p style="color:red;">Please enter all marks!</p>';
                return;
            }

            const total = s1 + s2 + s3;
            const average = total / 3;
            const resultStatus = average >= 40 ? 'Pass' : 'Fail';

            result.innerHTML = '<p>Total Marks: ' + total + '</p>' +
                             '<p>Average: ' + average.toFixed(2) + '</p>' +
                             '<p>Result: <strong>' + resultStatus + '</strong></p>';
        });
    </script>
</body>
</html>
