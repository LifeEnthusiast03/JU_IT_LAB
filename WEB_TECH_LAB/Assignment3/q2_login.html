<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Book Store - Login</title>
<style>body{padding:10px;margin:0}.nav{background:#555;padding:5px;text-align:center;margin-bottom:10px}.nav a{color:#fff;margin:0 8px;text-decoration:none;display:inline-block;padding:4px 8px;font-size:.9em}.nav a:hover{background:#333}.container{max-width:380px;margin:15px auto;padding:15px;border:1px solid #ddd}h1{text-align:center;margin:5px 0;font-size:1.2em}label{display:block;margin:8px 0 3px;font-weight:bold;font-size:.9em}input{width:100%;padding:6px;margin-bottom:8px;border:1px solid #ddd;box-sizing:border-box;font-size:.9em}.checkbox-group{display:flex;align-items:center;margin-bottom:8px}.checkbox-group input{width:auto;margin-right:8px}.checkbox-group label{margin:0;font-size:.9em}button{width:100%;padding:8px;background:#333;color:#fff;border:none;cursor:pointer;font-weight:bold;font-size:.9em}button:hover{background:#555}.demo-btn{background:#27ae60;margin-top:5px}.demo-btn:hover{background:#229954}p{text-align:center;margin:10px 0;font-size:.9em}a{color:#333;text-decoration:none}a:hover{text-decoration:underline}.error{color:#e74c3c;font-size:11px;margin-top:3px;display:none}.success{color:#27ae60;font-size:11px;margin-top:3px;display:none}</style>
</head>
<body>
<div class="nav">
<a href="q2_home.html">Home</a> <a href="q2_catalogue.html">Browse</a> <a href="q2_registration.html">Register</a>
</div>
<div class="container">
<h1>Login</h1>
<p style="text-align:center;color:#666;margin-bottom:10px">Access your account</p>
<form id="loginForm" onsubmit="handleLogin(event)">
<label for="email">Email:</label>
<input type="email" id="email" placeholder="email@example.com" required />
<div class="error" id="emailError">Invalid email</div>
<label for="password">Password:</label>
<input type="password" id="password" placeholder="Password" required />
<div class="error" id="passwordError">Password required</div>
<div class="checkbox-group">
<input type="checkbox" id="remember" />
<label for="remember">Remember me</label>
</div>
<button type="submit">Login</button>
<button type="button" class="demo-btn" onclick="useDemoCredentials()">Demo Login</button>
</form>
<div class="success" id="successMsg">Success! Redirecting...</div>
<p style="margin-top:12px"><a href="#" onclick="alert('Reset link sent')">Forgot password?</a></p>
<p style="border-top:1px solid #ddd;padding-top:10px;margin-top:10px">
New user? <a href="q2_registration.html"><strong>Register</strong></a>
</p>
</div>
<script>
function handleLogin(e){e.preventDefault();const s=document.getElementById('email').value,a=document.getElementById('password').value,t=document.getElementById('successMsg');return s&&a?(s.includes('@')?(document.getElementById('emailError').style.display='none',document.getElementById('passwordError').style.display='none',t.style.display='block',setTimeout(()=>{alert('Welcome '+s),document.getElementById('loginForm').reset(),t.style.display='none'},1500),void 0):(document.getElementById('emailError').style.display='block',void 0)):(s||document.getElementById('emailError').style.display='block',a||document.getElementById('passwordError').style.display='block',void 0)}
function useDemoCredentials(){document.getElementById('email').value='demo@bookstore.com',document.getElementById('password').value='demo123',alert('Demo: Click Login')}
document.getElementById('email').addEventListener('focus',()=>{document.getElementById('emailError').style.display='none'}),document.getElementById('password').addEventListener('focus',()=>{document.getElementById('passwordError').style.display='none'});
</script>
</body>
</html>
