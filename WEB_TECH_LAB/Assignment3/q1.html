<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number to Words Converter</title>
    <style>
        body { padding: 20px; max-width: 500px; margin: 0 auto; }
        input { padding: 8px; width: 200px; }
        button { padding: 8px 15px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Number to Words Converter</h1>
    <p>Enter a number between 0-999:</p>
    <input type="text" id="numInput" placeholder="Enter number" maxlength="3" />
    <button id="convertBtn">Convert</button>
    <p id="result"></p>

    <script>
        const numInput = document.getElementById('numInput');
        const convertBtn = document.getElementById('convertBtn');
        const result = document.getElementById('result');

        const ones = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine'];
        const teens = ['Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
        const tens = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];

        numInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^0-9]/g, '');
            if (e.target.value.length > 3) {
                e.target.value = e.target.value.slice(0, 3);
            }
        });

        convertBtn.addEventListener('click', () => {
            const num = numInput.value.trim();
            console.log("enter ");
            
            if (num === '') {
                result.textContent = 'Please enter a number!';
                result.style.color = 'red';
                return;
            }

            let number = parseInt(num);
            
            if (number > 999) {
                result.textContent = 'Please enter a number between 0-999 only!';
                result.style.color = 'red';
                return;
            }

            if (number === 0) {
                result.textContent = 'Zero';
                result.style.color = 'green';
                return;
            }

            let words = '';

            if (number >= 100) {
                words += ones[Math.floor(number / 100)] + ' Hundred ';
                number = number % 100;
            }

            if (number >= 20) {
                words += tens[Math.floor(number / 10)];
                if (number % 10 > 0) {
                    words += ' ' + ones[number % 10];
                }
            } else if (number >= 10) {
                words += teens[number - 10];
            } else if (number > 0) {
                words += ones[number];
            }

            result.textContent = words.trim();
            result.style.color = 'green';
        });
    </script>
</body>
</html>
